apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

def appProfiles = new groovy.json.JsonSlurper().parse(rootProject.file('../scripts/app-profiles.json'))
def developmentSigningFile = rootProject.file('../credentials/android-development.properties')
def developmentSigning = new Properties()
if (developmentSigningFile.exists()) {
    developmentSigningFile.withInputStream { developmentSigning.load(it) }
}

android {
    namespace 'com.runtaeho.wear'
    compileSdk 36
    defaultConfig {
        applicationId appProfiles.production.applicationId
        minSdk 30
        targetSdk 36
        versionCode 68
        versionName '1.8.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        debug {
            def overridePath = providers.gradleProperty('RUNTAEHO_DEBUG_STORE_FILE').orNull
            if (overridePath != null && !new File(overridePath).isAbsolute()) {
                throw new GradleException('RUNTAEHO_DEBUG_STORE_FILE must be an absolute path to the matching phone debug key')
            }
            storeFile overridePath != null ? file(overridePath) : rootProject.file('../android/app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('RUNTAEHO_UPLOAD_STORE_FILE')) {
                // Preserve the phone's original android/app-relative path semantics.
                def supplied = new File(project.property('RUNTAEHO_UPLOAD_STORE_FILE').toString())
                storeFile supplied.isAbsolute() ? supplied : new File(rootProject.file('../android/app'), supplied.path)
                storePassword project.property('RUNTAEHO_UPLOAD_STORE_PASSWORD')
                keyAlias project.property('RUNTAEHO_UPLOAD_KEY_ALIAS')
                keyPassword project.property('RUNTAEHO_UPLOAD_KEY_PASSWORD')
            }
        }
        development {
            if (developmentSigningFile.exists()) {
                storeFile new File(developmentSigningFile.parentFile, developmentSigning.getProperty('storeFile'))
                storePassword developmentSigning.getProperty('storePassword')
                keyAlias developmentSigning.getProperty('keyAlias')
                keyPassword developmentSigning.getProperty('keyPassword')
            }
        }
    }
    flavorDimensions 'environment'
    productFlavors {
        local {
            dimension 'environment'
            signingConfig signingConfigs.development
        }
        development {
            dimension 'environment'
            signingConfig signingConfigs.development
        }
        production {
            dimension 'environment'
            signingConfig project.hasProperty('RUNTAEHO_UPLOAD_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    productFlavors.all { flavor ->
        def profile = appProfiles[flavor.name]
        applicationId profile.applicationId
        manifestPlaceholders += [RUNTAEHO_APP_NAME: profile.name]
    }
    buildTypes {
        debug { signingConfig null }
        release { signingConfig null }
    }
    sourceSets.main.java.srcDir('../../shared/watchsync-android/src/main/java')
}

dependencies {
    implementation 'androidx.health:health-services-client:1.1.0'
    // Health Services publishes its public future type as runtime-only.
    compileOnly 'com.google.guava:guava:32.0.1-android'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
}

// Validate the selected flavor's identity; never generate or substitute a signing key.
android.applicationVariants.all { variant ->
    def suffix = variant.name.capitalize()
    tasks.matching { it.name == "pre${suffix}Build" || it.name == "validateSigning${suffix}" }.configureEach {
        doFirst {
            def config = variant.signingConfig
            if (config?.storeFile == null || !config.storeFile.isFile()) {
                throw new GradleException(variant.flavorName == 'production'
                    ? 'Matching production signing keystore is missing; supply RUNTAEHO_DEBUG_STORE_FILE or RUNTAEHO_UPLOAD_* Gradle properties'
                    : 'Matching development signing keystore is missing; supply the existing credentials/android-development.properties and its key')
            }
        }
    }
}
