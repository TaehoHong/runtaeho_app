apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace 'com.runtaeho.wear'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.runtaeho.runtaeho'
        minSdk 30
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 68
        versionName '1.8.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.java.srcDir('../watchsync/src/main/java')
}
// Data Layer requires the same app identity and certificate on both devices.
// Reuse the existing phone configuration without duplicating signing material.
evaluationDependsOn(':app')
android.buildTypes.debug.signingConfig = project(':app').android.signingConfigs.debug
android.buildTypes.release.signingConfig = project(':app').android.buildTypes.release.signingConfig

dependencies {
    implementation 'androidx.health:health-services-client:1.1.0'
    // Health Services publishes its public future type as runtime-only.
    compileOnly 'com.google.guava:guava:32.0.1-android'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
}
